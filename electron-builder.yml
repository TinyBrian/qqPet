appId: io.github.qqpet
productName: QQPet
directories:
  output: dist
  buildResources: build
files:
  - out/**
extraResources:
  - from: resources
    to: .
    filter:
      - pet/**
      - icons/**
      - asr/**
asar: true
# Releases are uploaded by the GitHub workflow; no auto-update feed.
publish: []

win:
  # Releases ship x64 only. An arm64 payload is packed with 7-Zip's ARM64 filter, which the NSIS 7z
  # plugin cannot unpack: the installer then silently skips QQPet.exe and every DLL. Pin x64 so a
  # local build on an Apple Silicon Mac (default arch arm64) matches the release.
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.games

linux:
  target: [AppImage, deb]
  category: Game
  maintainer: qqpet
